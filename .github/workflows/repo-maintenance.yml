name: Repo maintenance

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner for the job. Public repos must pass ubuntu-latest, the self-hosted runners are private-repo only.
        type: string
        default: iomete-github-runners

permissions:
  # actions: write lets actions/stale cache its processing cursor between runs;
  # without it, runs that hit operations-per-run restart from the first PR each time.
  actions: write
  pull-requests: write
  issues: write

jobs:
  stale:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-issue-stale: -1
          days-before-issue-close: -1
          days-before-pr-stale: 30
          days-before-pr-close: 7
          exempt-pr-labels: keep-open
          stale-pr-label: stale
          stale-pr-message: >
            This PR has been inactive for 30 days and will be closed in 7 days if there is no
            further activity. Add the `keep-open` label to exempt it, or comment/push to reset
            the clock.
          close-pr-message: >
            Closing due to inactivity. Feel free to reopen if this is still relevant.
