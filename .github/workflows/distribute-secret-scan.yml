name: Distribute secret scan

# Opens a PR in every org repo that does not run the shared secret scan yet.
# iom-github-bot approves and merges those PRs once their checks pass.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Report what would change without pushing branches or opening PRs.
        type: boolean
        default: true
      repos:
        description: Space-separated repos to process instead of the whole org.
        type: string
        default: ""
  # Enable a weekly schedule once a full manual pass comes back clean, so repos
  # created later are picked up on their own:
  # schedule:
  #   - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  distribute:
    # This repo is public, so the self-hosted runners are not available to it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # GITHUB_TOKEN reaches only this repo and cannot write workflow files
      # anywhere, so the distributor runs as its own App.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          app-id: ${{ secrets.CI_DISTRIBUTOR_APP_ID }}
          private-key: ${{ secrets.CI_DISTRIBUTOR_APP_PRIVATE_KEY }}
          owner: iomete

      - name: Distribute
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DRY_RUN: ${{ github.event_name != 'workflow_dispatch' || inputs.dry-run }}
          REPOS: ${{ inputs.repos }}
        run: ./distribution/distribute.sh
