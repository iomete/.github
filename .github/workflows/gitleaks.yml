name: Gitleaks

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner for the job. Public repos must pass ubuntu-latest, the self-hosted runners are private-repo only.
        type: string
        default: iomete-github-runners
      config:
        description: Path to a gitleaks config in the calling repo, for repos that need their own allowlist.
        type: string
        default: ""
      version:
        description: gitleaks release to install.
        type: string
        default: "8.30.1"

jobs:
  scan:
    name: Scan for committed secrets
    runs-on: ${{ inputs.runs-on }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Scan only the commits this change adds, so findings already in history do
      # not fail every unrelated PR.
      - name: Resolve commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ] || [ "$EVENT" = "pull_request_target" ]; then
            echo "log_opts=$BASE_SHA..$HEAD_SHA" >> "$GITHUB_OUTPUT"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            echo "log_opts=$BEFORE_SHA..$AFTER_SHA" >> "$GITHUB_OUTPUT"
          else
            # New branch or first push: no usable base, scan the tip commit only.
            echo "log_opts=$AFTER_SHA~1..$AFTER_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Gitleaks
        uses: iomete/.github/actions/gitleaks@main
        with:
          mode: git
          log-opts: ${{ steps.range.outputs.log_opts }}
          config: ${{ inputs.config }}
          version: ${{ inputs.version }}
