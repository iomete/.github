name: "Gitleaks: scan for secrets"
description: "Scans a git commit range or a directory for committed secrets, and fails the job on a hit"
inputs:
  mode:
    description: "What to scan: 'git' for a commit range, 'dir' for a path on disk (e.g. an unpacked artifact)."
    required: false
    default: "git"
  path:
    description: "Directory to scan when mode is 'dir'."
    required: false
    default: "."
  log-opts:
    description: "git log options selecting the commit range when mode is 'git'. Empty scans all history."
    required: false
    default: ""
  config:
    description: "Path to a gitleaks config, for repos that need their own allowlist."
    required: false
    default: ""
  version:
    description: "gitleaks release to install."
    required: false
    default: "8.30.1"

runs:
  using: "composite"
  steps:
    - name: Install gitleaks
      shell: bash
      env:
        GITLEAKS_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        curl -sSfL -o /tmp/gitleaks.tar.gz \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
        sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
        gitleaks version

    - name: Scan for secrets
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        SCAN_PATH: ${{ inputs.path }}
        LOG_OPTS: ${{ inputs.log-opts }}
        CONFIG: ${{ inputs.config }}
      run: |
        set -euo pipefail
        # --redact keeps a found secret out of the public job log.
        args=(--redact --verbose --no-banner)
        [ -n "$CONFIG" ] && args+=(--config "$CONFIG")
        if [ "$MODE" = "dir" ]; then
          gitleaks dir "$SCAN_PATH" "${args[@]}"
        else
          [ -n "$LOG_OPTS" ] && args+=(--log-opts "$LOG_OPTS")
          gitleaks git . "${args[@]}"
        fi
